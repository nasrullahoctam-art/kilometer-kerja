
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#164e83">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/motor.svg">

  <title>Kilometer Kerja</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
    }

    header {
      background: #164e83;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    header img {
      width: 42px;
      height: 42px;
    }

    header strong { font-size: 18px; }
    header small { display: block; margin-top: 3px; }

    iframe {
      width: 100%;
      height: calc(100dvh - 72px);
      border: none;
      display: block;
      background: #f2f5f9;
    }

    #offline {
      display: none;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <img src="./icons/motor.svg" alt="Motor">
  <div>
    <strong>Kilometer Kerja</strong>
    <small>Pencatatan perjalanan harian</small>
  </div>
</header>

<div id="offline">
  Koneksi internet diperlukan untuk
  menyimpan dan melihat data kilometer.
</div>

<iframe
  id="app"
  title="Aplikasi Kilometer Kerja"
  allow="camera">
</iframe>

<script>
  // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT
  const APP_URL = 'https://script.google.com/macros/s/AKfycbyYRAy211G3zJNdQa_CR26XLXD_ZBU8-dL_cJ_1ug38cXQbXfXOmdClEZtfW2ZUZK4B/exec';

  const frame = document.getElementById('app');

  frame.src = APP_URL;

  function checkConnection() {
    document.getElementById('offline').style.display =
      navigator.onLine ? 'none' : 'block';
  }

  window.addEventListener('online', checkConnection);
  window.addEventListener('offline', checkConnection);

  checkConnection();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(error => console.error(
          'Service Worker:', error
        ));
    });
  }
</script>

</body>
</html>
